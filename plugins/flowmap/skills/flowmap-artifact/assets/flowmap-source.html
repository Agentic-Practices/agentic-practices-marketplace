  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ound:radial-gradient(1200px 700px at 20% -10%, #131a26 0%, #0a0d13 60%);\">\n\n  <!-- ===== TOP BAR ===== -->\n  <header style=\"flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid #1c2431; background:rgba(10,13,19,.75); backdrop-filter:blur(8px); z-index:30;\">\n    <div style=\"display:flex; align-items:center; gap:9px;\">\n      <span style=\"font-weight:700; font-size:15px; letter-spacing:.02em;\">Flowmap<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1px; height:22px; background:#232b38;\"><\u002Fdiv>\n    <div style=\"position:relative;\">\n      <button sc-camel-on-click=\"{{ onToggleProjMenu }}\" style=\"display:flex; align-items:center; gap:9px; background:#141a24; color:#e6edf3; border:1px solid #26303f; border-radius:8px; padding:7px 11px; font-size:13px; font-weight:600; max-width:250px; cursor:pointer;\">\n        <span style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ currentName }}<\u002Fspan>\n        <span style=\"opacity:.55; font-size:10px;\">▼<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ projMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ onCloseProjMenu }}\" style=\"position:fixed; inset:0; z-index:69;\"><\u002Fdiv>\n        <div style=\"position:absolute; top:calc(100% + 6px); left:0; min-width:250px; background:#131a24; border:1px solid #26303f; border-radius:10px; padding:5px; z-index:70; box-shadow:0 14px 44px rgba(0,0,0,.55); max-height:60vh; overflow-y:auto; display:flex; flex-direction:column; gap:2px;\">\n          <sc-for list=\"{{ projectOptions }}\" as=\"opt\" hint-placeholder-count=\"1\">\n            <button sc-camel-on-click=\"{{ opt.onPick }}\" style=\"{{ opt.style }}\">{{ opt.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:6px;\">\n      <button sc-camel-on-click=\"{{ onNewProject }}\" title=\"New project\" style=\"background:#141a24; color:#9fb0c3; border:1px solid #26303f; border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer;\">+ New<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onRenameProject }}\" title=\"Rename project\" style=\"background:#141a24; color:#9fb0c3; border:1px solid #26303f; border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer;\">Rename<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onDuplicateProject }}\" title=\"Duplicate this flowmap\" style=\"background:#141a24; color:#9fb0c3; border:1px solid #26303f; border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer;\">Copy<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onDeleteProject }}\" title=\"Delete project\" style=\"background:#141a24; color:#9fb0c3; border:1px solid #26303f; border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer;\">Delete<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;\"><\u002Fdiv>\n\n    <div style=\"position:relative; display:flex; align-items:center;\">\n      <span style=\"position:absolute; left:11px; font-size:13px; color:#5f6f82; pointer-events:none;\">⌕<\u002Fspan>\n      <input value=\"{{ query }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"Search nodes…\" style=\"width:180px; background:#141a24; color:#e6edf3; border:1px solid #26303f; border-radius:8px; padding:7px 11px 7px 30px; font-size:13px;\" data-comment-anchor=\"fc4852e086-input\">\n      <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onClearSearch }}\" title=\"Clear\" style=\"position:absolute; right:6px; background:none; border:none; color:#6b7a8d; cursor:pointer; font-size:15px; line-height:1; padding:2px 4px;\">×<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:10px;\">\n      <div style=\"text-align:right; line-height:1.1;\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600;\">{{ doneCount }}<span style=\"color:#5f6f82;\"> / {{ total }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:10px; color:#5f6f82; letter-spacing:.08em; text-transform:uppercase;\">complete<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:110px; height:8px; background:#161d28; border-radius:6px; overflow:hidden; border:1px solid #232b38;\">\n        <div style=\"height:100%; width:{{ pctWidth }}; background:linear-gradient(90deg,#4ade80,#38bdf8); box-shadow:0 0 10px rgba(56,189,248,.5); transition:width .4s cubic-bezier(.2,.8,.2,1);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; width:38px; text-align:right;\">{{ pct }}%<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"width:1px; height:22px; background:#232b38;\"><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:6px; background:#141a24; border:1px solid #26303f; border-radius:8px; padding:3px;\" title=\"How group hulls are drawn\">\n      <button sc-camel-on-click=\"{{ onHullBlob }}\" style=\"{{ hullBlobStyle }}\">◍ Blob<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onHullOutline }}\" style=\"{{ hullOutlineStyle }}\">◌ Outline<\u002Fbutton>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ onTogglePreviewComplete }}\" title=\"Preview the map as if every node were done\" style=\"{{ previewCompleteBtnStyle }}\">{{ previewCompleteLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onToggleEdit }}\" style=\"{{ editBtnStyle }}\">{{ editLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onExport }}\" title=\"Export JSON\" style=\"background:#141a24; color:#9fb0c3; border:1px solid #26303f; border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer;\">Export<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onImportClick }}\" title=\"Import JSON\" style=\"background:#141a24; color:#9fb0c3; border:1px solid #26303f; border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer;\">Import<\u002Fbutton>\n    <input type=\"file\" accept=\"application/json\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onImportFile }}\" style=\"display:none;\">\n    <button sc-camel-on-click=\"{{ onLegacyClick }}\" title=\"Import old-style JSON (tracks/track schema) — lays nodes out group-by-group\" style=\"background:#141a24; color:#9fb0c3; border:1px solid #26303f; border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer;\">Legacy Parser<\u002Fbutton>\n    <input type=\"file\" accept=\"application/json\" ref=\"{{ legacyFileRef }}\" sc-camel-on-change=\"{{ onLegacyFile }}\" style=\"display:none;\">\n  <\u002Fheader>\n\n  <!-- ===== MAIN ROW ===== -->\n  <div style=\"flex:1; display:flex; min-height:0;\">\n\n    <!-- ===== GROUPS RAIL ===== -->\n    <aside style=\"flex:0 0 232px; width:232px; background:#0d121b; border-right:1px solid #1c2431; display:flex; flex-direction:column; min-height:0;\">\n      <div style=\"flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:16px 16px 12px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#8b98a8;\">Groups<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#4d5b6e;\">{{ groupCount }}<\u002Fspan>\n        <div style=\"flex:1;\"><\u002Fdiv>\n        <sc-if value=\"{{ activeGroupSet }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onClearActive }}\" title=\"Clear highlight\" style=\"background:none; border:none; color:#6b7a8d; cursor:pointer; font-size:11px; font-weight:600;\">clear<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:1; overflow-y:auto; padding:0 10px 10px; display:flex; flex-direction:column; gap:4px;\">\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"{{ g.rowStyle }}\">\n " fill-opacity=\"{{ h.fillOp }}\" stroke=\"{{ h.stroke }}\" stroke-width=\"{{ h.strokeW }}\" stroke-opacity=\"{{ h.strokeOp }}\"><\u002Fpath>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ tethers }}\" as=\"t\" hint-placeholder-count=\"0\">\n            <line x1=\"{{ t.cx }}\" y1=\"{{ t.cy }}\" x2=\"{{ t.nx }}\" y2=\"{{ t.ny }}\" stroke=\"{{ t.color }}\" stroke-width=\"{{ t.width }}\" stroke-opacity=\"{{ t.opacity }}\" stroke-linecap=\"round\" stroke-dasharray=\"2 8\"><\u002Fline>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ tethers }}\" as=\"t\" hint-placeholder-count=\"0\">\n            <circle cx=\"{{ t.cx }}\" cy=\"{{ t.cy }}\" r=\"4\" fill=\"{{ t.color }}\" fill-opacity=\"0.9\"><\u002Fcircle>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ edges }}\" as=\"e\" hint-placeholder-count=\"0\">\n            <path d=\"{{ e.d }}\" fill=\"none\" stroke=\"{{ e.color }}\" stroke-width=\"{{ e.width }}\" stroke-opacity=\"{{ e.opacity }}\" stroke-dasharray=\"{{ e.dash }}\"><\u002Fpath>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ edges }}\" as=\"e\" hint-placeholder-count=\"0\">\n            <circle cx=\"{{ e.ex }}\" cy=\"{{ e.ey }}\" r=\"3\" fill=\"{{ e.color }}\" fill-opacity=\"{{ e.opacity }}\"><\u002Fcircle>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n\n        <sc-for list=\"{{ hullLabels }}\" as=\"hl\" hint-placeholder-count=\"0\">\n          <div sc-camel-on-click=\"{{ hl.onClick }}\" sc-camel-on-mouse-down=\"{{ stop }}\" style=\"{{ hl.style }}\">{{ hl.name }}<\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ nodes }}\" as=\"node\" hint-placeholder-count=\"6\">\n          <div data-node-id=\"{{ node.id }}\" sc-camel-on-mouse-down=\"{{ node.onPointerDown }}\" sc-camel-on-context-menu=\"{{ node.onContextMenu }}\" sc-camel-on-mouse-enter=\"{{ node.onHoverEnter }}\" sc-camel-on-mouse-leave=\"{{ node.onHoverLeave }}\" style=\"{{ node.cardStyle }}\">\n            <div style=\"display:flex; align-items:center; gap:8px;\">\n              <span data-role=\"icon\" style=\"{{ node.iconStyle }}\">{{ node.icon }}<\u002Fspan>\n              <sc-if value=\"{{ node.isEditingTitle }}\" hint-placeholder-val=\"{{ false }}\">\n                <input value=\"{{ node.editingTitleValue }}\" sc-camel-on-input=\"{{ node.onTitleInput }}\" sc-camel-on-blur=\"{{ node.onTitleBlur }}\" sc-camel-on-key-down=\"{{ node.onTitleKey }}\" ref=\"{{ node.titleInputRef }}\" sc-camel-auto-complete=\"off\" sc-camel-auto-correct=\"off\" sc-camel-spell-check=\"false\" style=\"flex:1; font-size:13.5px; font-weight:600; line-height:1.3; background:#0a0f16; border:1px solid #3a4b61; border-radius:5px; color:#fff; padding:2px 5px; min-width:0;\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ node.notEditingTitle }}\" hint-placeholder-val=\"{{ true }}\">\n                <span data-role=\"title\" style=\"flex:1; font-size:13.5px; font-weight:600; line-height:1.3; {{ node.titleExtra }}\">{{ node.title }}<\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"{{ node.sizeStyle }}\">{{ node.size }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:6px; margin-top:10px;\">\n              <div style=\"display:flex; align-items:center; gap:4px;\">\n                <sc-for list=\"{{ node.dots }}\" as=\"d\" hint-placeholder-count=\"1\">\n                  <span style=\"{{ d.style }}\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ node.noGroups }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; color:#4d5b6e; letter-spacing:.04em;\">ungrouped<\u002Fspan>\n              <\u002Fsc-if>\n              <div style=\"flex:1;\"><\u002Fdiv>\n              <span style=\"{{ node.metaStyle }}\">{{ node.meta }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ node.showTodoBar }}\" hint-placeholder-val=\"{{ fals  notEditMode }}\" hint-placeholder-val=\"{{ true }}\">\n              <h2 style=\"margin:0; font-size:20px; font-weight:700; line-height:1.25;\">{{ sel.title }}<\u002Fh2>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- panel body -->\n          <div style=\"flex:1; overflow-y:auto; padding:18px 22px 24px;\" data-comment-anchor=\"f4a6eee00f-div\" sc-camel-on-context-menu=\"{{ stop }}\">\n            <!-- description -->\n            <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-bottom:18px;\">\n                <div style=\"{{ labelStyle }}\">Description<\u002Fdiv>\n                <textarea value=\"{{ sel.desc }}\" sc-camel-on-input=\"{{ sel.onDesc }}\" rows=\"2\" style=\"width:100%; background:#0e141d; border:1px solid #26303f; border-radius:8px; color:#cdd8e5; font-size:13px; padding:8px 10px; line-height:1.5;\"><\u002Ftextarea>\n                <div style=\"display:flex; gap:8px; margin-top:12px; align-items:center;\">\n                  <span style=\"{{ labelStyle }}; margin:0;\">Size<\u002Fspan>\n                  <sc-for list=\"{{ sel.sizeOpts }}\" as=\"s\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ s.onPick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <!-- groups membership -->\n              <div style=\"margin-bottom:20px;\">\n                <div style=\"{{ labelStyle }}\">Groups <span style=\"color:#4d5b6e;\">— a node can be in several<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; flex-wrap:wrap; gap:6px;\">\n                  <sc-for list=\"{{ sel.groupToggles }}\" as=\"gt\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ gt.onToggle }}\" style=\"{{ gt.style }}\">\n                      <span style=\"width:8px;height:8px;border-radius:3px;background:{{ gt.color }};flex:0 lor:#4d5b6e;cursor:pointer;font-size:14px;padding:0 4px; opacity:.7;\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ sel.noTodos }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12.5px; color:#5f6f82; padding:8px 2px; font-style:italic;\">No checklist items yet. Add one below.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; gap:7px; margin-top:10px;\">\n              <input value=\"{{ newTodoText }}\" sc-camel-on-input=\"{{ onTodoInput }}\" sc-camel-on-key-down=\"{{ onTodoKey }}\" placeholder=\"Add a step…\" style=\"flex:1; background:#0e141d; border:1px solid #26303f; border-radius:8px; color:#e6edf3; font-size:13px; padding:8px 11px;\">\n              <button sc-camel-on-click=\"{{ onAddTodo }}\" style=\"background:#1c2836; border:1px solid #2c3a4d; color:#c6d2e0; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;\">Add<\u002Fbutton>\n            <\u002Fdiv>\n\n            <!-- unlocks -->\n            <div style=\"{{ labelStyle }} margin-top:24px;\">Unlocks<\u002Fdiv>\n            <sc-if value=\"{{ sel.hasUnlocks }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                <sc-for list=\"{{ sel.unlocks }}\" as=\"uk\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-mouse-enter=\"{{ uk.onHoverEnter }}\" sc-camel-on-mouse-leave=\"{{ uk.onHoverLeave }}\" style=\"{{ uk.style }}\">\n                    <span style=\"{{ uk.dotStyle }}\">{{ uk.icon }}<\u002Fspan>\n                    <span style=\"flex:1; font-size:12.5px; font-weight:500;\">{{ uk.title }}<\u002Fspan>\n                    <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ uk.onRemove }}\" style=\"background:none;border:none;color:#6b7a8d;cursor:pointer;font-size:14px;padding:0 2px;\">×<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sel.noUnlocks }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:12.5px; color:#5f6f82; font-style:italic;\">Nothing depends on this yet.<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n              <details style=\"margin-top:12px;\">\n                <summary style=\"cursor:pointer; font-size:12.5px; font-weight:600; color:#cdd8e5; list-style:none; user-select:none; display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:8px; background:#182130; border:1px solid #2c3a4d;\">＋ Edit unlocks…<\u002Fsummary>\n                <input value=\"{{ sel.unlockQuery }}\" sc-camel-on-input=\"{{ sel.onUnlockSearch }}\" placeholder=\"Search nodes…\" style=\"width:100%; box-sizing:border-box; margin-top:8px; background:#0e141d; border:1px solid #26303f; border-radius:8px; color:#e6edf3; font-size:12px; padding:7px 10px;\">\n                <div style=\"max-height:190px; overflow-y:auto; margin-top:6px; border:1px solid #1c2431; border-radius:8px; padding:6px;\">\n                  <sc-for list=\"{{ sel.allOthersUnlock }}\" as=\"o\" hint-placeholder-count=\"0\">\n                    <label style=\"{{ o.style }}\">\n                      <input type=\"checkbox\" checked=\"{{ o.isUnlock }}\" sc-camel-on-change=\"{{ o.onToggle }}\" style=\"accent-color:#60a5fa;\">\n                      <span style=\"width:7px;height:7px;border-radius:2px;background:{{ o.color }};flex:0 0 auto;\"><\u002Fspan>\n                      <span style=\"font-size:12px;\">{{ o.title }}<\u002Fspan>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdetails>\n            <\u002Fsc-if>\n          <\u002Fd nu }}\" sc-camel-on-context-menu=\"{{ onContextMenuOverlayContext }}\" style=\"position:fixed; inset:0; z-index:75;\"><\u002Fdiv>\n    <div style=\"{{ cmenu.style }}\">\n      <sc-if value=\"{{ cmenu.isEditToggle }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ cmenu.onEditToggle }}\" style=\"{{ cmItemStyle }}\" style-hover=\"{{ cmItemHoverStyle }}\">{{ cmenu.editToggleLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cmenu.isAddNode }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ cmenu.onAddNodeHere }}\" style=\"{{ cmItemStyle }}\" style-hover=\"{{ cmItemHoverStyle }}\">+ Add node here<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cmenu.isNewGroup }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ cmenu.onNewGroup }}\" style=\"{{ cmItemStyle }}\" style-hover=\"{{ cmItemHoverStyle }}\">▢ New group…<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cmenu.isMain }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-if value=\"{{ cmenu.showUnlockSelected }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ cmenu.onUnlockSelected }}\" style=\"{{ cmItemStyle }} color:#facc15;\" style-hover=\"{{ cmItemHoverStyle }}\">{{ cmenu.unlockSelectedLabel }}<\u002Fbutton>\n          <div style=\"height:1px; background:#232c39; margin:4px 2px;\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ cmenu.onDuplicate }}\" style=\"{{ cmItemStyle }}\" style-hover=\"{{ cmItemHoverStyle }}\">⧉ Duplicate<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ cmenu.onAddNeed }}\" style=\"{{ cmItemStyle }}\" style-hover=\"{{ cmItemHoverStyle }}\">◂ Add prerequisite…<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ cmenu.onAddUnlock }}\" style=\"{{ cmItemStyle }}\" style-hover=\"{{ cmItemHoverStyle }}\">▸ Add unlock…<\u002Fbutton>\n        <div style=\"height:1px; background:#232c39; margin:4px 2px;\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ cmenu.onDelete }}\" style=\"{{ cmDeleteStyle }}\" style-hover=\"{{ cmDeleteHoverStyle }}\">✕ Delete<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cmenu.isSub }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; align-items:center; gap:6px; padding:2px 4px 6px;\">\n          <button sc-camel-on-click=\"{{ cmenu.onBack }}\" style=\"background:none;border:none;color:#7d8da0;cursor:pointer;font-size:13px;padding:2px 4px;\">‹<\u002Fbutton>\n          <span style=\"font-size:11.5px; font-weight:600; color:#c6d2e0;\">{{ cmenu.title }}<\u002Fspan>\n        <\u002Fdiv>\n        <input value=\"{{ cmenu.query }}\" sc-camel-on-input=\"{{ cmenu.onSearch }}\" placeholder=\"Search nodes…\" sc-camel-auto-focus=\"true\" style=\"width:100%; box-sizing:border-box; background:#0e141d; border:1px solid #26303f; border-radius:7px; color:#e6edf3; font-size:12px; padding:6px 9px; margin-bottom:6px;\">\n        <div style=\"max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:1px;\">\n          <sc-for list=\"{{ cmenu.items }}\" as=\"ci\" hint-placeholder-count=\"0\">\n            <label style=\"{{ ci.style }}\">\n              <input type=\"checkbox\" checked=\"{{ ci.checked }}\" sc-camel-on-change=\"{{ ci.onToggle }}\" style=\"accent-color:#60a5fa;\">\n              <span style=\"width:7px;height:7px;border-radius:2px;background:{{ ci.color }};flex:0 0 auto;\"><\u002Fspan>\n              <span style=\"font-size:12px;\">{{ ci.title }}<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ cmenu.noItems }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:11.5px; color:#5f6f82; padding:8px; font-style:italic;\">No matches.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n\n  <!-- ===== MODAL ===== -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onModalCancel }}\" style=\"position:fixed; inset:0; background:rgba(5,7,11,.6); backdrop-filter:blur(3px); z-index:60; display:flex; align-items:center; justify-content:center;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:400px; max-width:90vw; background:#131a24; border:1px solid #26303f; border-radius:14px; padding:22px; box-shadow:0 24px 70px rgba(0,0,0,.6);\">\n        <div style=\"font-size:16px; font-weight:700; margin-bottom:14px;\">{{ modalTitle }}<\u002Fdiv>\n        <input value=\"{{ modalValue }}\" sc-camel-on-input=\"{{ onModalInput }}\" sc-camel-on-key-down=\"{{ onModalKey }}\" ref=\"{{ modalInputRef }}\" placeholder=\"{{ modalPlaceholder }}\" style=\"width:100%; background:#0e141d; border:1px solid #2c3a4d; border-radius:9px; color:#fff; font-size:14px; padding:11px 13px; margin-bottom:16px;\">\n        <sc-if value=\"{{ modalHasCheckbox }}\" hint-placeholder-val=\"{{ false }}\">\n          <label style=\"display:flex; align-items:center; gap:9px; margin-bottom:16px; cursor:pointer; font-size:13px; color:#c6d2e0;\">\n            <input type=\"checkbox\" checked=\"{{ modalCheckboxValue }}\" sc-camel-on-change=\"{{ onModalCheckbox }}\" style=\"accent-color:#8b5cf6; width:16px; height:16px;\">\n            <span>{{ modalCheckboxLabel }}<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fsc-if>\n        <div style=\"display:flex; justify-content:flex-end; gap:9px;\">\n          <button sc-camel-on-click=\"{{ onModalCancel }}\" style=\"background:#1a222e; border:1px solid #2c3a4d; color:#9fb0c3; border-radius:9px; padding:9px 16px; font-size:13px; cursor:pointer;\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onModalOk }}\" style=\"background:linear-gradient(135deg,#3b82f6,#8b5cf6); border:none; color:#fff; border-radius:9px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer;\">{{ modalOk }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PALETTE = ['#60a5fa','#4ade80','#a78bfa','#f5a623','#f472b6','#2dd4bf','#fb7185','#38bdf8','#fbbf24','#34d399','#c084fc','#22d3ee'];\nconst NEUTRAL = '#5f6f82';\n\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.contentEl = null;\n    this.fileEl = null;\n    this.modalInputEl = null;\n    this._sig = '';\n    this._drag = null;\n    this._onMove = (e) => this.dragMove(e);\n    this._onUp = (e) => this.dragUp(e);\n    this.fieldCanvas = null;\n    this._fieldRaf = null; this._fieldSig = '';\n    this._dragActive = false;\n    this._canvas = null;\n    this._onCanvasMove = (e) => this.canvasMove(e);\n    this._onCanvasUp = (e) => this.canvasUp(e);\n    this.state = this.loadInitial();\n  }\n\n  // ---------- persistence ----------\n  loadInitial(){\n    let data = null;\n    try {\n      const raw = localStorage.getItem('flowmap.v2');\n      if (raw){ const d = JSON.parse(raw); if (d && d.projects) data = d; }\n    } catch(e){}\n    if (!data){\n      // Try migrating an old columns/rows map into the new group model.\n      try {\n        const rawOld = localStorage.getItem('flowmap.v1');\n        if (rawOld){ const old = JSON.parse(rawOld); if (old && old.projects) data = this.migrateV1(old); }\n      } catch(e){}\n    }\n    if (!data){\n      const bp = this.blankProject(); bp._blank = true;\n      data = { projects: { [bp.id]: bp }, currentId: bp.id, _seededV: {} };\n    }\n    if (!data.projects[data.currentId]) data.currentId = Object.keys(data.projects)[0] || null;\n    this.normalizeData(data);\n    try { localStorage.setItem('flowmap.v2', JSON.stringify(data)); } catch(e){}\n    return { data, selectedId: null, editMode: true, modal: null, newTodoText: '', edges: [], hullGeom: [], svg: {w:0,h:0}, zoom: 1, highlightMode: 'hover', hoverId: null, hullStyle: 'blob', activeGroup: null, dragPos: null };\n  }\n\n  // Guards against stray legacy-shaped projects (track/tracks instead of groups)\n  // ending up in the v2 store, so a bad project can never crash the whole render.\n  normalizeData(data){\n    Object.values(data.projects || {}).forEach(pr => {\n      if (!Array.isArray(pr.groups)){\n        pr.groups = (pr.tracks || []).map(t => ({ id: t.id, name: t.name, color: t.color }));\n      }\n      pr.nodes = pr.nodes || {};\n      Object.values(pr.nodes).forEach(n => {\n        if (!Array.isArray(n.groups)) n.groups = n.track ? [n.track] : [];\n        if (!Array.isArray(n.needs)) n.needs = [];\n        if (!Array.isArray(n.todos)) n.todos = [];\n      });\n    });\n  }\n\n  migrateV1(old){\n    const data = { projects: {}, currentId: null, _seededV: {} };\n    const seeded = old._seededV || old._seeded || {};\n    Object.values(old.projects).forEach(pr => {\n      if (seeded[pr.id]) return; // drop previously auto-seeded starters\n      const groups = (pr.tracks || []).map(t => ({ id: t.id, name: t.name, color: t.color }));\n      const nodes = {};\n      Object.values(pr.nodes || {}).forEach(n => {\n        nodes[n.id] = {\n          id: n.id, title: n.title, groups: n.track ? [n.track] : [],\n          size: n.size || 'S', desc: n.desc || '', needs: (n.needs||[]).slice(),\n          needMode: n.needMode, todos: (n.todos||[]).map(t=>({...t})),\n          manualDone: !!n.manualDone, x: null, y: null,\n        };\n      });\n      const proj = { id: pr.id, name: pr.name, groups, nodes };\n      this.autoLayout(proj);\n      data.projects[pr.id] = proj;\n      if (!data.currentId) data.currentId = pr.id;\n    });\n    if (!Object.keys(data.projects).length) return null;\n    return data;\n  }\n\n  blankProject(){\n    return { id: this.uid('p'), name: 'New Flowmap', groups: [ { id:this.uid('g'), name:'Group A', color:PALETTE[0] }, { id:this.uid('g'), name:'Group B', color:PALETTE[1] } ], nodes: {} };\n  }\n\n  autoLayout(p){\n    const nodes = p.nodes; const ids = Object.keys(nodes);\n    const depth = {};\n    const calc = (id, seen) => {\n      if (depth[id] != null) return depth[id];\n      if (seen.has(id)) return 0;\n      seen.add(id);\n      const ns = (nodes[id].needs||[]).filter(x => nodes[x]);\n      const d = ns.length ? Math.max(...ns.map(x => calc(x, seen))) + 1 : 0;\n      depth[id] = d; return d;\n    };\n    ids.forEach(id => calc(id, new Set()));\n    const byDepth = {};\n    ids.forEach(id => { (byDepth[depth[id]] = byDepth[depth[id]] || []).push(id); });\n    const COLW = 262, ROWH = 128, x0 = 90, y0 = 90;\n    Object.keys(byDepth).sort((a,b)=>a-b).forEach(d => {\n      byDepth[d].forEach((id, i) => { if (nodes[id].x == null){ nodes[id].x = x0 + d*COLW; nodes[id].y = y0 + i*ROWH; } });\n    });\n  }\n\n  mergeStarters(data){\n    const starters = (typeof window !== 'undefined' && window.FLOWMAP_STARTERS) || null;\n    if (!Array.isArray(starters)) return false;\n    data._seededV = data._seededV || {};\n    let changed = false;\n    const incomingIds = new Set(starters.filter(s => s && s.id).map(s => s.id));\n    Object.keys(data._seededV).forEach(sid => {\n      if (!incomingIds.has(sid)){ if (data.projects[sid]) delete data.projects[sid]; delete data._seededV[sid]; changed = true; }\n    });\n    starters.forEach(s => {\n      if (!s || !s.id) return;\n      const v = s.v || 1; const seen = data._seededV[s.id];\n      if (seen == null || seen < v){\n        const { v: _v, ...proj } = s;\n        const clone = structuredClone(proj);\n        this.autoLayout(clone);\n        data.projects[s.id] = clone;\n        data._seededV[s.id] = v; changed = true;\n      }\n    });\n    return changed;\n  }\n  async loadStarters(){\n    try {\n      const src = (typeof window !== 'undefined' && window.__resources && window.__resources.starters) || 'flowmap-starters.json';\n      const res = await fetch(src, { cache: 'no-store' });\n      if (res.ok){ const arr = await res.json(); if (Array.isArray(arr)) window.FLOW \n    const complete = {};\n    Object.keys(nodes).forEach(id => complete[id] = false);\n    for (let pass = 0; pass < Object.keys(nodes).length + 1; pass++){\n      let changed = false;\n      for (const id in nodes){\n        const n = nodes[id];\n        const val = this.needsMet(n, complete) && this.rawDone(n);\n        if (val !== complete[id]){ complete[id] = val; changed = true; }\n      }\n      if (!changed) break;\n    }\n    return complete;\n  }\n  isLocked(n, complete){ return !this.needsMet(n, complete); }\n  allNodesDone(){\n    const nodes = this.currentProject().nodes;\n    const ids = Object.keys(nodes);\n    return ids.length > 0 && ids.every(id => this.rawDone(nodes[id]));\n  }\n  toggleAllDone(){\n    const makeDone = !this.allNodesDone();\n    this.updateProject(p => {\n      Object.values(p.nodes).forEach(n => {\n        n.manualDone = makeDone;\n        (n.todos||[]).forEach(t => { t.done = makeDone; });\n      });\n    });\n  }\n  trailSet(id){\n    // Returns a Map of nodeId -> distance (in requirement hops) from id.\n    const nodes = this.currentProject().nodes;\n    const dist = new Map();\n    let frontier = [id];\n    let d = 0;\n    while (frontier.length){\n      const next = [];\n      frontier.forEach(x => {\n        const n = nodes[x]; if (!n) return;\n        (n.needs||[]).forEach(nid => {\n          if (!dist.has(nid)){ dist.set(nid, d+1); next.push(nid); }\n        });\n      });\n      frontier = next; d++;\n    }\n    return dist;\n  }\n  redShade(depth, alpha){\n    const dd = Math.max(1, depth||1);\n    const t = Math.min(1, (dd-1)/4);\n    const l = 45 + t*30;\n    return alpha == null ? `hsl(0, 78%, ${l}%)` : `hsla(0, 78%, ${l}%, ${alpha})`;\n  }\n  // Same trail concept as trailSet, but seeded from every member of a group at once,\n  // and blind to needs/unlocks between two nodes that are both in the group — those\n  // internal links are ignored so only the group's external deps/unlocks surface.\n  groupTrailSet(gid){\n    const nodes = this.currentProject().nodes;\n    const members = new Set(Object.values(nodes).filter(n => (n.groups||[]).includes(gid)).map(n => n.id));\n    const upstream = new Set();\n    const walk = (x) => { const n = nodes[x]; if (!n) return; (n.needs||[]).forEach(nid => { if (members.has(nid)) return; if (!upstream.has(nid)){ upstream.add(nid); walk(nid); } }); };\n    members.forEach(m => walk(m));\n    const downstream = new Set();\n    Object.values(nodes).forEach(n => { if (members.has(n.id)) return; if ((n.needs||[]).some(nid => members.has(nid))) downstream.add(n.id); });\n    return { members, upstream, downstream };\n  }\n\n  // ---------- geometry helpers ----------\n  convexHull(points){\n    const pts = points.slice().sort((a,b)=>a.x-b.x||a.y-b.y);\n    if (pts.length < 3) return pts;\n    const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);\n    const lower = [];\n    for (const p of pts){ while (lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop(); lower.push(p); }\n    const upper = [];\n    for (let i=pts.length-1;i>=0;i--){ const p=pts[i]; while (upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop(); upper.push(p); }\n    lower.pop(); upper.pop();\n    return lower.concat(upper);\n  }\n  chaikin(poly, iters){\n    let p = poly;\n    for (let k=0;k<iters;k++){\n      const q = []; const n = p.length;\n      for (let i=0;i<n;i++){ const a=p[i], b=p[(i+1)%n]; q.push({x:a.x*0.75+b.x*0.25, y:a.y*0.75+b.y*0.25}); q.push({x:a.x*0.25+b.x*0.75, y:a.y*0.25+b.y*0.75}); }\n      p = q;\n    }\n    return p;\n  }\n  polyPath(poly){\n    if (!poly.length) return '';\n    let d = 'M' + poly[0].x.toFixed(1) + ',' + poly[0].y.toFixed(1);\n    for (let i=1;i<poly.length;i++) d += ' L' + poly[i].x.toFixed(1) + ',' + poly[i].y.toFixed(1);\n    return d + ' Z';\n  }\n  rectPointDist(px, py, b){ const dx = Math.max(b.l-px, px-(b.l+b.w), 0); const dy = Math.max(b.t-py, py-(b.t+b.h), 0); return Math.sqrt(dx*dx+dy*dy); }\n  anchor(box, to){\n    const cx = box.l + box.w/2, cy = box.t + box.h/2;\n    const dx = to.cx - cx, dy = to.cy - cy;\n    if (dx === 0 && dy === 0) return { x: cx, y: cy };\n    const hw = box.w/2 + 3, hh = box.h/2 + 3;\n    const sx = dx === 0 ? Infinity : hw/Math.abs(dx);\n    const sy = dy === 0 ? Infinity : hh/Math.abs(dy);\n    const s = Math.min(sx, sy);\n    return { x: cx + dx*s, y: cy + dy*s };\n  }\n  hex(c, a){ const r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }\n\n  // ---------- lifecycle / measurement ----------\n  componentDidMount(){\n    this.persist();\n    this.loadStarters();\n    this._resize = () => this.measure();\n    window.addEventListener('resize', this._resize);\n    this._onKey = (e) => {\n      if (e.key === 'Escape'){ if (this.state.armGroup){ this.setState({armGroup:false, marquee:null}); if (this.scrollEl) this.scrollEl.style.cursor=''; } else if (this.state.contextMenu) this.setState({contextMenu:null}); else if (this.state.modal) this.setState({modal:null}); else if (this.state.activeGroup) this.setState({activeGroup:null}); else if (this.state.selectedId) this.setState({selectedId:null}); }\n    };\n    window.addEventListener('keydown', this._onKey);\n    requestAnimationFrame(() => this.measure());\n    setTimeout(() => { this.measure(); this.fitScrollToContent(); }, 250);\n  }\n  componentDidUpdate(){ if (this._dragActive) this.scheduleMeasure(); else this.measure(); }\n  // During an active drag, node positions change every pointermove, and each\n  // change triggers a re-render → measure(), which does a full-DOM\n  // getBoundingClientRect sweep (a forced synchronous layout). Running that at\n  // full frame rate is what makes dragging feel heavy. Cap it to ~30fps while\n  // dragging; the node/scroll motion itself is render-driven and stays smooth.\n  scheduleMeasure(){\n    if (this._measureTimer) return;\n    const since = performance.now() - (this._measureLast || 0);\n    const delay = Math.max(0, 32 - since);\n    this._measureTimer = setTimeout(() => {\n      this._measureTimer = null;\n      this._measureLast = performance.now();\n      this.measure();\n    }, delay);\n  }\n  componentWillUnmount(){ window.removeEventListener('resize', this._resize); window.removeEventListener('keydown', this._onKey); window.removeEventListener('pointermove', this._onMove); window.removeEventListener('pointerup', this._onUp); window.removeEventListener('pointermove', this._onCanvasMove); window.removeEventListener('pointerup', this._onCanvasUp); if (this._fieldRaf) cancelAnimationFrame(this._fieldRaf); if (this._zoomRaf) cancelAnimationFrame(this._zoomRaf); if (this._measureTimer) clearTimeout(this._measureTimer); if (this.scrollEl && this._onWheel) this.scrollEl.removeEventListener('wheel', this._onWheel); }\n\n  measure(){\n    const el = this.contentEl; if (!el) return;\n    const z = this._zoomAnim != null ? this._zoomAnim : (this.state.zoom || 1); el.style.zoom = z;\n    const base = el.getBoundingClientRect();\n    const pos = {};\n    el.querySelectorAll('[data-node-id]').forEach(n => {\n      const r = n.getBoundingClientRect();\n      pos[n.getAttribute('data-node-id')] = { l:(r.left-base.left)/z, t:(r.top-base.top)/z, w:r.width/z, h:r.height/z };\n    });\n    this._nodeRects = pos;\n    const p = this.currentProject(); const nodes = p.nodes;\n    let maxX = 700, maxY = 500;\n    for (const id in pos){ const b = pos[id]; maxX = Math.max(maxX, b.l+b.w); maxY = Math.max(maxY, b.t+b.h); }\n    const svg = { w: Math.ceil(maxX + 260), h: Math.ceil(maxY + 200) };\n\n    const complete = this.computeComplete();\n    const selId = this.highlightId();\n    const upstream = selId ? this.trailSet(selId) : null;\n    const activeGroup = this.state.activeGroup || null;\n    const gTrail = (!selId && activeGroup) ? this.groupTrailSet(activeGroup) : null;\n\n    const edges = [];\n    for (const id in nodes){\n      const node = nodes[id];\n      (node.needs||[]).forEach(nid => {\n        const a = pos[nid], b = pos[id]; if (!a || !b) return;\n        const A = { cx:a.l+a.w/2, cy:a.t+a.h/2 }, B = { cx:b.l+b.w/2, cy:b.t+b.h/2 };\n        const s = this.anchor(a, B), e2 = this.anchor(b, A);\n        const sx = s.x, sy = s.y, ex = e2.x, ey = e2.y;\n        const dx = ex - sx, dy = ey - sy;\n        const c1x = sx + dx*0.42, c1y = sy + dy*0.12, c2x = ex - dx*0.42, c2y = ey - dy*0.12;\n        const d = `M${sx.toFixed(1)},${sy.toFixed(1)} C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;\n        const active = !!complete[nid];\n        let color = this.primaryColor(nodes[nid]);\n        let opacity = active ? 0.8 : 0.24, width = active ? 2 : 1.3, dash = active ? 'none' : '5 5';\n        if (selId){\n          const isUp = (id === selId) || (upstream && upstream.has(id));\n          const isDown = (nid === selId);\n          if (isUp){\n            opacity = 0.95; width = 2.4; dash = 'none';\n            if (!complete[nid]){\n              const idDist = (id === selId) ? 0 : upstream.get(id);\n              color = this.redShade((idDist||0)+1);\n              opacity = 0.4; width = 1.6;\n            }\n          }\n          else if (isDown){ color = complete[id] ? '#fbbf24' : '#a16207'; opacity = 0.95; width = 2.4; dash = 'none'; }\n          else { opacity = 0.06; width = 1; }\n        } else if (gTrail){\n          const nidM = gTrail.members.has(nid), idM = gTrail.members.has(id);\n          const inChain = (x) => gTrail.members.has(x) || gTrail.upstream.has(x);\n          if (nidM && idM){ opacity = 0.05; width = 1; }\n          else if (inChain(nid) && inChain(id)){ opacity = 0.95; width = 2.4; dash = 'none'; if (!complete[nid]){ color = this.redShade(1); opacity = 0.4; width = 1.6; } }\n          else if (nidM && !idM){ color = complete[id] ? '#fbbf24' : '#a16207'; opacity = 0.95; wi
